name: Build and Publish

on:
  push:
    branches: [ceen, main]
    tags: ['v*']
  pull_request:
    branches: [ceen, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-out version to Marketplace
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to validate (for example, v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate extension identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          if (`${manifest.publisher}.${manifest.name}` !== 'yeceen.har-assist') {
            throw new Error('Expected extension ID yeceen.har-assist');
          }
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error(`Release tag must be v${manifest.version}`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: har-assist-vsix
          path: har-assist.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'ceendev/har-assist' && ((github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: har-assist-vsix
      - name: Check publishing credentials
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See PUBLISHING.md."
            exit 1
          fi
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish using Microsoft Entra ID
        run: npx --no-install vsce publish --packagePath har-assist.vsix --azure-credential --skip-duplicate

  github-release:
    if: github.repository == 'ceendev/har-assist' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: har-assist-vsix
      - name: Create GitHub release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" har-assist.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" har-assist.vsix --verify-tag --generate-notes --title "Har Assist ${RELEASE_TAG#v}" --repo "$GITHUB_REPOSITORY"
          fi
